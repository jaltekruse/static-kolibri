<tr>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">write</code></td>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">filevar.write(astring)</code></td>
<td class="l m b0 r0 l0 t0 lines">Add astring to the end of the file. filevar must refer to a file that has been  opened for writing.</td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">read(n)</code></td>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">filevar.read()</code></td>
<td class="l m b0 r0 l0 t0 lines">Reads and returns a string of <code class="code-inline tex2jax_ignore">n</code> characters, or the entire file as a single string if  n is not provided.</td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">readline(n)</code></td>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">filevar.readline()</code></td>
<td class="l m b0 r0 l0 t0 lines">Returns the next line of the file with all text up to and including the newline character. If n is provided as a parameter than only n characters will be returned if the line is longer than <code class="code-inline tex2jax_ignore">n</code>.</td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">readlines(n)</code></td>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">filevar.readlines()</code></td>
<td class="l m b0 r0 l0 t0 lines">Returns a list of strings, each representing a single line of the file. If n is not provided then all lines of the file are returned. If n is provided then n characters are read but n is rounded up so that an entire line is returned.</td>
</tr>
